project:
  output-dir: _output

# Two mutually exclusive render targets, selected by Quarto profile (the first
# member of the group is the default). `identified` is the normal build
# (`just render-paper`); `blind` is the double-anonymous submission build
# (`just render-blind`). The render list has to be switched by profile rather
# than by rendering `index-blind.qmd` directly: a file outside the project's
# render list is treated as a standalone document and would silently lose this
# file's format configuration.
profile:
  group:
    - [identified, blind]

number-sections: true

bibliography: references.bib

execute:
  echo: false
  # freeze: true  # never re-render during project render
  # freeze: auto
  freeze: false

format:
  html:
    theme: litera
  pdf:
    pdf-engine: lualatex
    documentclass: scrartcl
    papersize: letter
    fontsize: 11pt
    fig-pos: '!htb'
    indent: true
    monofont: "DejaVu Sans Mono"
    monofontoptions: "Scale=0.7"
    cite-method: natbib
    biblio-style: econometrica
    template-partials:
      - title.tex
    include-before-body:
      - keywords.tex
    include-in-header:
      text: |
        \setkomafont{disposition}{\rmfamily\bfseries}
        \usepackage{url}
        \usepackage[noblocks]{authblk}
        \renewcommand*{\Authsep}{, }
        \renewcommand*{\Authand}{, }
        \renewcommand*{\Authands}{, }
        \renewcommand\Affilfont{\small}
    linestretch: 1.25
    geometry:
      - inner=3cm
      - outer=3cm
      - top=3cm
      - bottom=3cm
      - headsep=22pt
      - headheight=11pt
      - footskip=33pt
      - ignorehead
      - ignorefoot
      - heightrounded
